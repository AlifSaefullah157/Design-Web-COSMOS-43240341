<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>COSMOS - Ensiklopedia & Observatorium Tata Surya</title>
    <meta name="description" content="Eksplorasi fotorealistik 8 planet utama tata surya, simulasi orbit Kepler 3D interaktif, dan kuis astronomi presisi." />
    <link rel="icon" type="image/png" href="/cosmos-logo.png" />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Space Grotesk', 'monospace'],
              space: ['Space Grotesk', 'sans-serif'],
            },
            screens: {
              xs: '420px',
            },
            keyframes: {
              meteor: {
                '0%': { transform: 'translateX(-10%) translateY(-10%) rotate(24deg)', opacity: '0' },
                '15%': { opacity: '0.9' },
                '40%': { transform: 'translateX(120vw) translateY(65vh) rotate(24deg)', opacity: '0' },
                '100%': { transform: 'translateX(120vw) translateY(65vh) rotate(24deg)', opacity: '0' },
              },
              'spin-slow': {
                '0%': { transform: 'rotate(0deg)' },
                '100%': { transform: 'rotate(360deg)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-8px)' },
              },
            },
            animation: {
              meteor: 'meteor 10s ease-in-out infinite',
              'spin-slow': 'spin-slow 28s linear infinite',
              float: 'float 5s ease-in-out infinite',
            }
          }
        }
      };
    </script>

    <link rel="stylesheet" href="/style.css">
    <!-- Top Status Bar Mobile Preview Helper -->
    <meta name="theme-color" content="#0a0e18" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

    <style>
      /* Menyembunyikan scroll bar di seluruh halaman web (kanan) tanpa mematikan fungsi scroll */
      html, body {
        scrollbar-width: none !important; /* Firefox */
        -ms-overflow-style: none !important; /* Internet Explorer 10+ & Edge */
        overflow-y: auto;
      }

      /* Chrome, Safari, Opera, Edge Chromium */
      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      *::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
        background: transparent !important;
      }

      * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }

      /* Utility class no-scrollbar */
      .no-scrollbar::-webkit-scrollbar { display: none !important; width: 0 !important; }
      .no-scrollbar { -ms-overflow-style: none !important; scrollbar-width: none !important; }

      /* Safe area insets untuk perangkat seluler */
      .pb-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
      .pt-safe { padding-top: max(0.5rem, env(safe-area-inset-top)); }

      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes telemetryProgress {
        0% { width: 0%; }
        15% { width: 18%; }
        45% { width: 52%; }
        75% { width: 84%; }
        100% { width: 100%; }
      }

      .animate-telemetry-progress {
        animation: telemetryProgress 2.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
    
      #splash-telemetry-progress-bar {
        transition: width 35ms linear;
        will-change: width;
      }
    </style>
  </head>
  <body class="bg-[#070a13] text-[#dfe2f1] font-sans antialiased overflow-x-hidden select-none min-h-screen relative">
    
    <!-- Deep Space Galactic Cosmos (Interactive Starfield Canvas & Multi-spectral Nebulae) -->
    <div id="cosmos-bg-container" aria-hidden="true" class="fixed inset-0 pointer-events-none overflow-hidden z-0">
      <!-- Deep Obsidian Starry Gradient -->
      <div class="absolute inset-0 bg-gradient-to-b from-[#04060d] via-[#070b16] to-[#050711]"></div>

      <!-- Atmospheric Cosmic Nebulae & Dust Clouds with Hardware Accelerated Parallax Shifting -->
      <div id="nebula-layer-amber" class="absolute -top-[10%] left-1/4 -translate-x-1/2 w-[500px] md:w-[850px] h-[500px] md:h-[850px] rounded-full bg-gradient-to-br from-[#ffb95f]/15 via-[#38bdf8]/12 to-transparent blur-[140px] opacity-75 animate-pulse will-change-transform" style="animation-duration: 12s;"></div>
      <div id="nebula-layer-purple" class="absolute top-[30%] -right-[15%] w-[450px] md:w-[750px] h-[450px] md:h-[750px] rounded-full bg-gradient-to-tl from-[#a855f7]/15 via-[#6366f1]/12 to-transparent blur-[130px] opacity-70 animate-pulse will-change-transform" style="animation-duration: 16s; animation-delay: 2s;"></div>
      <div id="nebula-layer-cyan" class="absolute -bottom-20 left-1/3 w-[380px] md:w-[600px] h-[380px] md:h-[600px] rounded-full bg-gradient-to-tr from-[#0284c7]/15 via-[#38bdf8]/10 to-transparent blur-[120px] opacity-80 will-change-transform"></div>

      <!-- Subtle Astronomical Celestial Coordinate Rings & Orbit Axis -->
      <svg id="celestial-rings-layer" class="absolute inset-0 w-full h-full opacity-25 stroke-[#38bdf8] will-change-transform" xmlns="http://www.w3.org/2000/svg" fill="none">
        <circle cx="32%" cy="48%" r="290" stroke-dasharray="2 8" stroke-width="0.75" />
        <circle cx="32%" cy="48%" r="420" stroke-dasharray="4 14" stroke-width="0.5" />
        <circle cx="32%" cy="48%" r="580" stroke-dasharray="1 10" stroke-width="0.5" />
        <circle cx="32%" cy="48%" r="760" stroke-dasharray="3 16" stroke-width="0.4" opacity="0.6" />
        <line x1="0" y1="48%" x2="100%" y2="48%" stroke-dasharray="3 9" stroke-width="0.4" opacity="0.4" />
        <line x1="32%" y1="0" x2="32%" y2="100%" stroke-dasharray="3 9" stroke-width="0.4" opacity="0.4" />
      </svg>

      <!-- High-Performance Animated Space Starfield Canvas (Placed above nebulae for razor-sharp sparkling visibility) -->
      <canvas id="space-cosmos-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>

      <!-- Meteor / Shooting Star Streaks -->
      <div class="absolute top-12 left-16 w-36 h-0.5 bg-gradient-to-r from-transparent via-[#38bdf8] to-white rotate-[25deg] blur-[0.5px] animate-meteor opacity-75 z-20"></div>
      <div class="absolute top-1/3 right-1/4 w-28 h-0.5 bg-gradient-to-r from-transparent via-[#a855f7] to-white rotate-[30deg] blur-[0.5px] animate-meteor opacity-60 z-20" style="animation-delay: 4.5s; animation-duration: 14s;"></div>
    </div>

    <!-- Toast Notification Container -->
    <div id="cosmos-toast" class="fixed top-5 right-5 z-50 transform -translate-y-20 opacity-0 pointer-events-none transition-all duration-300 ease-out flex items-center gap-3 px-4 py-3 rounded-2xl bg-[#171b26]/95 border border-[#38bdf8]/40 shadow-[0_8px_30px_rgba(0,0,0,0.6)] backdrop-blur-xl text-xs font-space text-[#dfe2f1]">
      <span class="material-symbols-outlined text-[#38bdf8] text-[20px]">check_circle</span>
      <span id="cosmos-toast-message">Pembaruan berhasil disimpan</span>
    </div>

    <!-- ROOT CONTAINER UNTUK VANILLA DOM ENGINE -->
    <div id="vanilla-app" class="relative z-10 min-h-screen flex flex-col justify-between"></div>

    <!-- Three.js (3D WebGL Realistic Planetary Engine) -->
    <script src="/three.min.js"></script>
    <script>
      if (!window.THREE) {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
        document.head.appendChild(s);
      }
    </script>

    <!-- Motion Framer (Framer Motion Web Animation Engine) -->
    <script src="/motion.umd.js"></script>
    <script>
      // Fallback ke CDN jika script lokal terhalang
      if (!window.Motion) {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/motion@10.18.0/dist/motion.umd.js';
        document.head.appendChild(s);
      }
    </script>

    <!-- SCRIPT UTAMA VANILLA STATE & DOM ENGINE -->
    <script src="script.js?v=2.5"></script>
  </body>
</html>
